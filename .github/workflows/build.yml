name: Build

# Repo yapisi:
#   CursedPortal.zip              <- plugin zip'i (repo kokune yukle)
#   .github/workflows/build.yml   <- bu dosya

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Unzip plugin source
        run: |
          mkdir -p _src
          ZIPS=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' -not -path './_src/*')
          if [ -n "$ZIPS" ]; then
            for z in $ZIPS; do
              echo "Opening $z"
              unzip -o "$z" -d _src
            done
          fi

      - name: Build with Maven
        run: |
          POM=$(find _src . -name pom.xml -not -path './.git/*' 2>/dev/null | head -1)
          if [ -z "$POM" ]; then
            echo "pom.xml bulunamadi (zip repo kokunde mi?)"; exit 1
          fi
          echo "Using $POM"
          mvn -B -f "$POM" clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CursedPortal
          path: '**/target/CursedPortal.jar'
          if-no-files-found: error
